<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>To Do List</title>
<style>
:root{--bg:#f3f1ec;--card:#fffdf9;--ink:#1f2a37;--mute:#7b8591;--line:#e1ddd3;--accent:#2f6f5e;--accent-ink:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14181d;--card:#1c2229;--ink:#e8ecf0;--mute:#8a95a1;--line:#2b333c;--accent:#5fb89f;--accent-ink:#10231e}}
:root[data-theme="dark"]{--bg:#14181d;--card:#1c2229;--ink:#e8ecf0;--mute:#8a95a1;--line:#2b333c;--accent:#5fb89f;--accent-ink:#10231e}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Avenir Next","Trebuchet MS",system-ui,sans-serif;font-size:17px;-webkit-tap-highlight-color:transparent;min-height:100%}
main{max-width:1100px;margin:0 auto;padding:16px}
h1{font-size:1.5rem;margin:8px 0 14px;letter-spacing:-.01em}
.tabs{display:flex;gap:6px;background:var(--line);padding:4px;border-radius:14px;margin-bottom:14px}
.tabs button{flex:1;min-height:44px;border:0;border-radius:11px;background:transparent;color:var(--mute);font:inherit;font-weight:600}
.tabs button[aria-selected="true"]{background:var(--card);color:var(--ink)}
.cols{display:grid;gap:14px;grid-template-columns:minmax(0,1fr)}
.col{min-width:0}
.col{display:none;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px}
.col.on{display:block}
.col.today{border-color:var(--accent);border-width:2px}
.col h2{margin:0;font-size:1.15rem}
.col .date{color:var(--mute);font-size:.9rem;margin:2px 0 10px}
ul{list-style:none;margin:0;padding:0}
li{display:flex;align-items:center;gap:4px;border-top:1px solid var(--line)}
.chk{flex:none;width:44px;height:44px;border:0;background:transparent;padding:0;display:grid;place-items:center}
.ring{width:28px;height:28px;border-radius:50%;border:2px solid var(--mute);display:grid;place-items:center;transition:background .15s,border-color .15s}
.ring svg{width:16px;height:16px;stroke:var(--accent-ink);fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;opacity:0}
li.done .ring{background:var(--accent);border-color:var(--accent)}
li.done .ring svg{opacity:1}
li.done .txt{color:var(--mute);text-decoration:line-through}
.txt{flex:1;padding:10px 0;overflow-wrap:anywhere}
.del{flex:none;width:44px;height:44px;border:0;background:transparent;color:var(--mute);font-size:1.3rem}
.empty{color:var(--mute);padding:12px 0;font-size:.95rem}
.add{display:flex;gap:8px;margin-top:12px}
.add input{flex:1;min-width:0;min-height:44px;border:1px solid var(--line);border-radius:12px;padding:0 12px;background:var(--bg);color:var(--ink);font:inherit}
.add button{min-height:44px;padding:0 16px;border:0;border-radius:12px;background:var(--accent);color:var(--accent-ink);font:inherit;font-weight:700}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
@media (min-width:760px){.tabs{display:none}.cols{grid-template-columns:repeat(3,minmax(0,1fr));align-items:start}.col{display:block}}
</style>
</head>
<body>
<main>
<h1>Drei Tage</h1>
<div class="tabs" role="tablist" id="tabs"></div>
<div class="cols" id="cols"></div>
</main>
<script>
var NAMES=["Gestern","Heute","Morgen"], OFFS=[-1,0,1], active=1, baseKey="";
function pad(n){return n<10?"0"+n:""+n}
function keyFor(off){var d=new Date();d.setDate(d.getDate()+off);return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
function labelFor(off){var d=new Date();d.setDate(d.getDate()+off);return d.toLocaleDateString("de-DE",{weekday:"long",day:"numeric",month:"long"})}
function load(k){try{var v=localStorage.getItem("todo:"+k);return v?JSON.parse(v):[]}catch(e){return []}}
function save(k,list){try{localStorage.setItem("todo:"+k,JSON.stringify(list))}catch(e){}}
function el(tag,cls,txt){var e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e}

function render(){
  baseKey=keyFor(0);
  var tabs=document.getElementById("tabs"),cols=document.getElementById("cols");
  tabs.innerHTML="";cols.innerHTML="";
  OFFS.forEach(function(off,i){
    var k=keyFor(off), list=load(k);
    var t=el("button",null,NAMES[i]);t.setAttribute("role","tab");t.setAttribute("aria-selected",i===active);
    t.onclick=function(){active=i;render()};tabs.appendChild(t);

    var col=el("section","col"+(i===active?" on":"")+(off===0?" today":""));
    col.appendChild(el("h2",null,NAMES[i]));
    col.appendChild(el("div","date",labelFor(off)));
    var ul=el("ul");
    if(!list.length)ul.appendChild(el("div","empty","Noch nichts eingetragen."));
    list.forEach(function(item){
      var li=el("li",item.d?"done":"");
      var b=el("button","chk");b.setAttribute("aria-label",(item.d?"Als offen markieren: ":"Erledigt: ")+item.t);
      b.innerHTML='<span class="ring"><svg viewBox="0 0 16 16"><path d="M3 8.5l3.2 3L13 4.5"/></svg></span>';
      b.onclick=function(){item.d=!item.d;save(k,list);render()};
      var x=el("button","del","×");x.setAttribute("aria-label","Löschen: "+item.t);
      x.onclick=function(){save(k,list.filter(function(o){return o!==item}));render()};
      li.appendChild(b);li.appendChild(el("span","txt",item.t));li.appendChild(x);ul.appendChild(li);
    });
    col.appendChild(ul);

    var f=el("div","add"),inp=el("input");
    inp.type="text";inp.placeholder="Neue Aufgabe";inp.maxLength=120;inp.setAttribute("aria-label","Neue Aufgabe für "+NAMES[i]);
    var add=el("button",null,"Hinzufügen");
    function submit(){var v=inp.value.trim();if(!v)return;list.push({t:v,d:false});save(k,list);render()}
    add.onclick=submit;inp.onkeydown=function(e){if(e.key==="Enter")submit()};
    f.appendChild(inp);f.appendChild(add);col.appendChild(f);
    cols.appendChild(col);
  });
}
// Datum nachführen, wenn die App wieder sichtbar wird oder Mitternacht vorbei ist
function checkDay(){if(keyFor(0)!==baseKey)render()}
document.addEventListener("visibilitychange",function(){if(!document.hidden)checkDay()});
setInterval(checkDay,60000);
render();
</script>
</body>
</html>
